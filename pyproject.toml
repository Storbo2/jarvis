[project]
name = "asistente-jarvis"
version = "0.1.0"
description = "Experimento de control de Windows mediante gestos de mano y voz"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
asistente-jarvis = "asistente_jarvis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asistente_jarvis"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
