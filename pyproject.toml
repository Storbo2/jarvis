[project]
name = "asistente-jarvis"
version = "0.1.0"
description = "Experimento de control de Windows mediante gestos de mano y voz"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "faster-whisper>=1.1,<2",
    "huggingface-hub>=0.30,<2",
    "mediapipe>=0.10.21,<2",
    "openwakeword>=0.6,<0.7",
    "opencv-contrib-python>=4.10,<5",
    "pyautogui>=0.9.54,<1",
    "sounddevice>=0.5,<1",
]

[project.scripts]
asistente-jarvis = "asistente_jarvis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asistente_jarvis"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
